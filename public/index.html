<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    
    <!-- Иконка сайта во вкладке браузера -->
    <link rel="icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Цвет панели браузера на смартфонах -->
    <meta name="theme-color" content="#000000" />
    
    <!-- Иконка для Айфонов при сохранении на экран -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Подключение манифеста (для PWA / установки как приложение) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Подключение скрипта Яндекс Карт (твоя рабочая строка) -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>

    <!-- =========================================================================
        НАСТРОЙКА ДЛЯ ПОИСКОВИКОВ (GOOGLE, ЯНДЕКС)
        ========================================================================= -->
    <title>ONE | Тренажерный зал в Минске</title>
    <meta name="description" content="Современный тренажерный зал ONE на Гамарника 30А в Минске. Уютный зал, просторные раздевалки, душевые и зона функционального тренинга." />

    <!-- =========================================================================
        НАСТРОЙКА OPEN GRAPH (ОФОРМЛЕНИЕ ССЫЛКИ ДЛЯ TELEGRAM, WHATSAPP, VK)
        ========================================================================= -->
    <meta property="og:type" content="website" />
    
    <!-- Жирный заголовок в превью чата -->
    <meta property="og:title" content="ONE | Тренажерный зал в Минске" />
    
    <!-- Серый текст описания под заголовком в чате -->
    <meta property="og:description" content="Современный тренажерный зал на Гамарника 30А. Всё для вашего комфорта и результата. Смотреть фото и цены на сайте." />
    
    <!-- Ссылка на твой сайт (замени на свой реальный домен, когда купишь его) -->
    <meta property="og:url" content="https://gym-one.by" />

    <!-- Картинка-превью для чатов -->
    <meta property="og:image" content="%PUBLIC_URL%/assets/images/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
